    var l=L();
    $('#gSub').textContent=l.loginTitle;
    gBtn.textContent=l.loginBtn;
    gPass.placeholder=S.lang==='ar'?'كلمة المرور':'Password';
    document.getElementById('gate').dir=S.lang==='ar'?'rtl':'ltr';
  }
  function showApp(){gate.classList.add('off');appRoot.style.display='';render()}
  function showGate(){appRoot.style.display='none';gate.classList.remove('off');setGateLang();gPass.value='';gErr.textContent='';gBtn.disabled=false}

  loginForm.addEventListener('submit',function(e){
    e.preventDefault();
    gErr.textContent='';gBtn.disabled=true;gBtn.innerHTML='<span class="spin"></span>';
    sb.auth.signInWithPassword({email:ADMIN_EMAIL,password:gPass.value}).then(function(r){
      if(r.error){gErr.textContent=L().loginErr;gBtn.disabled=false;gBtn.textContent=L().loginBtn;return}
      loadAll().then(showApp).catch(function(){gErr.textContent=L().loadErr;gBtn.disabled=false;gBtn.textContent=L().loginBtn});
    });
  });
  $('#logout').addEventListener('click',function(){
    if(!confirm(L().logoutConfirm))return;
    sb.auth.signOut().then(function(){showGate()});
  });

  setGateLang();
  sb.auth.getSession().then(function(r){
    var session=r.data&&r.data.session;
    if(session){ loadAll().then(showApp).catch(function(){showGate();gErr.textContent=L().loadErr}); }
    else{ showGate(); }
  });
})();
</script>
</body>
</html>
